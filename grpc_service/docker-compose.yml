services:
  # Base de datos Postgres
  db:
    image: postgres:15-alpine
    container_name: postgres_inventarios
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: inventarios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ESTO ES LO QUE FALTABA:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventarios"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: